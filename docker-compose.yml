services:
  # 웹 대시보드 (메인)
  web:
    build: .
    entrypoint: ["checkweek", "web", "-p", "5001"]
    ports:
      - "5001:5001"
    env_file:
      - path: .env
        required: false
    volumes:
      - checkweek-data:/root/.checkweek
    restart: unless-stopped

  # 일회성 CLI 명령 실행용
  checkweek:
    build: .
    env_file:
      - path: .env
        required: false
    volumes:
      - checkweek-data:/root/.checkweek
    profiles:
      - cli

  # 매주 자동 동기화 스케줄러 (백그라운드 데몬)
  scheduler:
    build: .
    entrypoint: ["checkweek", "run-scheduler"]
    env_file:
      - path: .env
        required: false
    volumes:
      - checkweek-data:/root/.checkweek
    restart: unless-stopped

volumes:
  checkweek-data:
